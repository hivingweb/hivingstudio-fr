<!DOCTYPE html>
<html lang="fr">
<head>
<meta charset="UTF-8" />
<meta name="viewport" content="width=device-width, initial-scale=1.0" />
<title>LA CUISINE — Studio food Paris | HIVING FOOD</title>
<meta name="description" content="LA CUISINE : cuisine pro Bonnet 6 feux + plancha + four à pizza, 70 m². Pour filmer le geste, la cuisson, la fumée. Brigade pro disponible. Réservation en ligne, devis instantané." />
<link rel="canonical" href="https://hivingstudio.fr/pages/la-cuisine.html" />
<meta property="og:title" content="LA CUISINE — HIVING FOOD" />
<meta property="og:description" content="120 m² · Cyclo blanc · Lumière nord · 4m sous plafond" />

<link rel="preconnect" href="https://fonts.googleapis.com" />
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
<link href="https://fonts.googleapis.com/css2?family=Fraunces:ital,opsz,wght@0,9..144,300;0,9..144,400;0,9..144,500;0,9..144,600;0,9..144,700;1,9..144,400;1,9..144,500&family=Inter:wght@300;400;500;600;700&family=JetBrains+Mono:wght@400;500&family=Caveat:wght@400;500;600;700&family=Familjen+Grotesk:wght@400;500;600;700&family=Archivo:wght@500;600;700;800&display=swap" rel="stylesheet" />

<script type="application/ld+json" id="ld-product"></script>

<style>body { margin: 0; background: #fafaf5; font-family: 'Inter', sans-serif; -webkit-font-smoothing: antialiased; } *, *::before, *::after { box-sizing: border-box; }</style>

<script src="https://unpkg.com/react@18.3.1/umd/react.development.js" integrity="sha384-hD6/rw4ppMLGNu3tX5cjIb+uRZ7UkRJ6BPkLpg4hAu/6onKUg4lLsHAs9EBPT82L" crossorigin="anonymous"></script>
<script src="https://unpkg.com/react-dom@18.3.1/umd/react-dom.development.js" integrity="sha384-u6aeetuaXnQ38mYT8rp6sbXaQe3NL9t+IBXmnYxwkUI2Hw4bsp2Wvmx4yRQF1uAm" crossorigin="anonymous"></script>
<script src="https://unpkg.com/@babel/standalone@7.29.0/babel.min.js" integrity="sha384-m08KidiNqLdpJqLq95G/LEi8Qvjl/xUYll3QILypMoQ65QorJ9Lvtp2RXYGBFj1y" crossorigin="anonymous"></script>

<script type="text/babel" src="../site-i18n.jsx"></script>
<script type="text/babel" src="../site-data.jsx"></script>
<script type="text/babel" src="../site-shared.jsx"></script>
</head>
<body>
<div id="root"></div>

<script type="text/babel">
const P = window.HIVING_PALETTE;

function detectSlug() {
  const path = window.location.pathname;
  const file = path.substring(path.lastIndexOf('/') + 1).replace('.html', '');
  return file || 'le-blanc';
}

function PlateauDetail() {
  const slug = detectSlug();
  const plateaux = window.HIVING_PLATEAUX;
  const plateau = plateaux.find(p => p.slug === slug) || plateaux[0];
  const others = plateaux.filter(p => p.slug !== plateau.slug);

  React.useEffect(() => {
    const ld = document.getElementById('ld-product');
    if (ld) {
      ld.textContent = JSON.stringify({
        "@context": "https://schema.org",
        "@type": "Product",
        "name": `Plateau ${plateau.name} — HIVING FOOD`,
        "description": plateau.desc,
        "brand": { "@type": "Brand", "name": "HIVING FOOD" },
        "offers": { "@type": "Offer", "price": String(plateau.price), "priceCurrency": "EUR", "availability": "https://schema.org/InStock" },
        "aggregateRating": { "@type": "AggregateRating", "ratingValue": "4.9", "reviewCount": "47" }
      });
    }
  }, [plateau.slug]);

  const isDark = plateau.color === '#0a0908';
  const accentColor = isDark ? P.lime : plateau.color;

  return (
    <window.PageShell active="plateaux">
      <window.Breadcrumb items={[
        { label: 'Plateaux', href: 'plateaux.html' },
        { label: plateau.name },
      ]} />

      {/* Hero */}
      <section style={{ padding: '60px 40px 80px', maxWidth: 1400, margin: '0 auto' }}>
        <div style={{ display: 'flex', justifyContent: 'space-between', alignItems: 'flex-start', gap: 40, flexWrap: 'wrap', marginBottom: 40 }}>
          <div style={{ flex: '1 1 600px' }}>
            <div style={{ fontFamily: P.mono, fontSize: 11, letterSpacing: '0.18em', color: P.inkSoft, marginBottom: 24, textTransform: 'uppercase' }}>
              ¶ Plateau {plateau.num}
            </div>
            <h1 style={{
              fontFamily: P.display, fontSize: 'clamp(64px, 11vw, 180px)',
              fontWeight: 700, letterSpacing: '-0.04em', lineHeight: 0.88, margin: 0,
            }}>
              {plateau.name}
            </h1>
            <p style={{
              fontFamily: P.hand, fontSize: 'clamp(36px, 5vw, 68px)', fontWeight: 700,
              color: accentColor, transform: 'rotate(-2deg)', display: 'inline-block',
              margin: '12px 0 0', lineHeight: 0.9,
            }}>
              — {plateau.tagline}
            </p>
          </div>
          <div style={{
            background: plateau.color, color: isDark ? P.bg : P.ink,
            padding: 32, borderRadius: 24, minWidth: 320,
            border: `1.5px solid ${P.ink}`,
          }}>
            <div style={{ fontFamily: P.mono, fontSize: 10, letterSpacing: '0.18em', opacity: 0.7, marginBottom: 8, textTransform: 'uppercase' }}>
              Tarif journée
            </div>
            <div style={{ fontFamily: P.display, fontSize: 56, fontWeight: 700, letterSpacing: '-0.025em', lineHeight: 1 }}>
              {plateau.price.toLocaleString('fr-FR')}&nbsp;€
            </div>
            <div style={{ fontFamily: P.mono, fontSize: 11, letterSpacing: '0.12em', marginTop: 4, opacity: 0.7 }}>
              HT · Demi-journée {plateau.priceHalf}&nbsp;€
            </div>
            <div style={{ height: 1, background: isDark ? `${P.bg}30` : `${P.ink}30`, margin: '20px 0' }} />
            <a href="../index.html#reserver" style={{
              display: 'block', background: isDark ? P.lime : P.ink,
              color: isDark ? P.ink : P.bg,
              padding: '16px 22px', borderRadius: 999, textAlign: 'center',
              fontFamily: P.sans, fontSize: 15, fontWeight: 600, textDecoration: 'none',
            }}>
              Réserver ce plateau →
            </a>
          </div>
        </div>

        <p style={{
          fontFamily: P.serif, fontSize: 'clamp(22px, 2.2vw, 30px)', lineHeight: 1.4,
          color: P.ink, maxWidth: 920, marginTop: 40,
        }}>
          {plateau.desc}
        </p>

        <div style={{ display: 'flex', gap: 8, flexWrap: 'wrap', marginTop: 24 }}>
          {plateau.tags.map(tag => (
            <span key={tag} style={{
              padding: '6px 14px', background: P.cream, borderRadius: 999,
              fontFamily: P.mono, fontSize: 11, letterSpacing: '0.1em',
              textTransform: 'uppercase', color: P.ink,
            }}>{tag}</span>
          ))}
        </div>
      </section>

      {/* Specs */}
      <section style={{ background: P.ink, color: P.bg, padding: '100px 40px' }}>
        <div style={{ maxWidth: 1400, margin: '0 auto' }}>
          <div style={{ fontFamily: P.mono, fontSize: 11, letterSpacing: '0.18em', opacity: 0.5, marginBottom: 24, textTransform: 'uppercase' }}>
            ¶ Specs techniques
          </div>
          <h2 style={{
            fontFamily: P.display, fontSize: 'clamp(40px, 5vw, 68px)',
            fontWeight: 700, letterSpacing: '-0.03em', lineHeight: 1, margin: '0 0 56px',
          }}>
            Tout ce que vous<br />
            <span style={{ fontFamily: P.hand, color: P.lime }}>devez savoir.</span>
          </h2>
          <div style={{ display: 'grid', gridTemplateColumns: 'repeat(auto-fit, minmax(220px, 1fr))', gap: 32 }}>
            {[
              { l: 'Surface', v: plateau.surface },
              { l: 'Hauteur sous plafond', v: plateau.ceiling },
              { l: 'Lumière', v: plateau.light },
              { l: 'Cyclo / décors', v: plateau.cyclo },
              { l: 'Capacité', v: plateau.capacity },
              { l: 'Accès', v: plateau.access },
            ].map((s, i) => (
              <div key={i} style={{ paddingTop: 20, borderTop: `1px solid ${P.bg}25` }}>
                <div style={{ fontFamily: P.mono, fontSize: 10, letterSpacing: '0.18em', opacity: 0.5, marginBottom: 12, textTransform: 'uppercase' }}>
                  {s.l}
                </div>
                <div style={{ fontFamily: P.serif, fontSize: 24, lineHeight: 1.3 }}>
                  {s.v}
                </div>
              </div>
            ))}
          </div>
        </div>
      </section>

      {/* Other plateaux */}
      <section style={{ padding: '120px 40px', maxWidth: 1400, margin: '0 auto' }}>
        <div style={{ fontFamily: P.mono, fontSize: 11, letterSpacing: '0.18em', color: P.inkSoft, marginBottom: 24, textTransform: 'uppercase' }}>
          ¶ Les deux autres plateaux
        </div>
        <div style={{ display: 'grid', gridTemplateColumns: 'repeat(auto-fit, minmax(320px, 1fr))', gap: 24 }}>
          {others.map(p => {
            const dark = p.color === '#0a0908';
            return (
              <a key={p.slug} href={`${p.slug}.html`} style={{
                display: 'block', textDecoration: 'none', color: dark ? P.bg : P.ink,
                background: p.color, padding: 32, borderRadius: 24,
                border: `1.5px solid ${P.ink}`, minHeight: 240,
              }}>
                <div style={{ fontFamily: P.mono, fontSize: 10, letterSpacing: '0.18em', opacity: 0.6, marginBottom: 16, textTransform: 'uppercase' }}>
                  Plateau {p.num}
                </div>
                <div style={{ fontFamily: P.display, fontSize: 48, fontWeight: 700, letterSpacing: '-0.025em', lineHeight: 1 }}>
                  {p.name}
                </div>
                <div style={{ fontFamily: P.hand, fontSize: 28, fontWeight: 700, marginTop: 6, color: dark ? P.lime : P.ink }}>
                  {p.tagline}
                </div>
                <div style={{ marginTop: 24, fontFamily: P.sans, fontSize: 14, fontWeight: 600 }}>
                  Voir le plateau →
                </div>
              </a>
            );
          })}
          <a href="comparateur.html" style={{
            display: 'flex', flexDirection: 'column', justifyContent: 'space-between',
            textDecoration: 'none', color: P.ink, background: P.lime,
            padding: 32, borderRadius: 24, border: `1.5px dashed ${P.ink}`, minHeight: 240,
          }}>
            <div style={{ fontFamily: P.mono, fontSize: 10, letterSpacing: '0.18em', opacity: 0.7, textTransform: 'uppercase' }}>
              ¶ Aide
            </div>
            <div>
              <div style={{ fontFamily: P.display, fontSize: 36, fontWeight: 700, letterSpacing: '-0.02em', lineHeight: 1 }}>
                Comparer les 3 plateaux
              </div>
              <div style={{ marginTop: 16, fontFamily: P.sans, fontSize: 14, fontWeight: 600 }}>
                Tableau comparatif →
              </div>
            </div>
          </a>
        </div>
      </section>

      <window.BigCTA
        eyebrow={`Réserver ${plateau.name}`}
        title="Bookez votre"
        hand="date."
        ctaLabel="Vérifier les dispos"
        ctaHref="../index.html#reserver"
        ctaSecondaryLabel="Devis instantané"
        ctaSecondaryHref="devis.html"
      />
    </window.PageShell>
  );
}

const root = ReactDOM.createRoot(document.getElementById('root'));
root.render(<PlateauDetail />);
</script>
</body>
</html>
