<!DOCTYPE html>
<html lang="fr">
<head>
<meta charset="UTF-8" />
<meta name="viewport" content="width=device-width, initial-scale=1.0" />
<title>Plan 3D des studios — Vue isométrique | HIVING FOOD</title>
<meta name="description" content="Plan 3D interactif des 3 plateaux HIVING : LE BLANC, LA TABLE, LA CUISINE. Surface, lumière, équipement, espaces communs." />
<link rel="canonical" href="https://hiving.food/pages/plan-3d.html" />
<link rel="preconnect" href="https://fonts.googleapis.com" />
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
<link href="https://fonts.googleapis.com/css2?family=Fraunces:ital,opsz,wght@0,9..144,300;0,9..144,400;0,9..144,500;0,9..144,600;0,9..144,700;1,9..144,400;1,9..144,500&family=Inter:wght@300;400;500;600;700&family=JetBrains+Mono:wght@400;500&family=Caveat:wght@400;500;600;700&family=Familjen+Grotesk:wght@400;500;600;700&family=Archivo:wght@500;600;700;800&display=swap" rel="stylesheet" />
<style>body { margin: 0; background: #fafaf5; font-family: 'Inter', sans-serif; -webkit-font-smoothing: antialiased; } *, *::before, *::after { box-sizing: border-box; }</style>
<script src="https://unpkg.com/react@18.3.1/umd/react.development.js" integrity="sha384-hD6/rw4ppMLGNu3tX5cjIb+uRZ7UkRJ6BPkLpg4hAu/6onKUg4lLsHAs9EBPT82L" crossorigin="anonymous"></script>
<script src="https://unpkg.com/react-dom@18.3.1/umd/react-dom.development.js" integrity="sha384-u6aeetuaXnQ38mYT8rp6sbXaQe3NL9t+IBXmnYxwkUI2Hw4bsp2Wvmx4yRQF1uAm" crossorigin="anonymous"></script>
<script src="https://unpkg.com/@babel/standalone@7.29.0/babel.min.js" integrity="sha384-m08KidiNqLdpJqLq95G/LEi8Qvjl/xUYll3QILypMoQ65QorJ9Lvtp2RXYGBFj1y" crossorigin="anonymous"></script>
<script type="text/babel" src="../site-i18n.jsx"></script>
<script type="text/babel" src="../site-data.jsx"></script>
<script type="text/babel" src="../site-shared.jsx"></script>
</head>
<body>
<div id="root"></div>
<script type="text/babel">
const P = window.HIVING_PALETTE;

// Iso projection helpers (cabinet-ish): x' = x - z*0.5, y' = y - z*0.866
function project(x, y, z) {
  return { x: x - z * 0.5, y: y - z * 0.5 };
}

// Each "room" is an extruded floor polygon. Color by plateau.
const ROOMS = [
  { id: 'le-blanc',  label: 'LE BLANC',  num: '01', area: '120 m²', color: '#ffffff', stroke: '#0a0908', x: 0,    y: 0,   w: 380, d: 280, h: 70, info: 'Cyclo blanc 8×5m · Lumière nord' },
  { id: 'la-table',  label: 'LA TABLE',  num: '02', area: '90 m²',  color: '#0a0908', stroke: '#0a0908', x: 380,  y: 0,   w: 300, d: 220, h: 60, info: '18 décors modulaires · Bois & marbre' },
  { id: 'la-cuisine', label: 'LA CUISINE', num: '03', area: '70 m²', color: '#e8a14a', stroke: '#0a0908', x: 380, y: 220, w: 300, d: 200, h: 65, info: 'Bonnet 6 feux · Plancha · Pizza' },
  { id: 'commun',  label: 'Espaces communs', num: '+', area: '90 m²', color: '#f0ecdf', stroke: '#0a0908', x: 0, y: 280, w: 380, d: 140, h: 40, info: 'Loges · Régie · Maquillage · Cuisine prep' },
];

function IsoRoom({ r, hovered, onHover, onLeave, onClick, sel }) {
  const isDark = r.color === '#0a0908';
  const top = [
    project(r.x, r.y, r.h),
    project(r.x + r.w, r.y, r.h),
    project(r.x + r.w, r.y + r.d, r.h),
    project(r.x, r.y + r.d, r.h),
  ];
  const bottomFront = [
    project(r.x, r.y + r.d, 0),
    project(r.x + r.w, r.y + r.d, 0),
    project(r.x + r.w, r.y + r.d, r.h),
    project(r.x, r.y + r.d, r.h),
  ];
  const bottomRight = [
    project(r.x + r.w, r.y + r.d, 0),
    project(r.x + r.w, r.y, 0),
    project(r.x + r.w, r.y, r.h),
    project(r.x + r.w, r.y + r.d, r.h),
  ];
  const poly = (pts) => pts.map(p => `${p.x},${p.y}`).join(' ');
  const cx = (top[0].x + top[2].x) / 2;
  const cy = (top[0].y + top[2].y) / 2;
  const isHover = hovered === r.id || sel === r.id;
  const lift = isHover ? 12 : 0;

  return (
    <g style={{ cursor: 'pointer', transform: `translate(0, ${-lift}px)`, transition: 'transform 0.3s cubic-bezier(.34,1.56,.64,1)' }}
       onMouseEnter={() => onHover(r.id)} onMouseLeave={onLeave} onClick={() => onClick(r.id)}>
      {/* shadow */}
      <polygon points={poly([
        project(r.x + 8, r.y + 8, 0),
        project(r.x + r.w + 8, r.y + 8, 0),
        project(r.x + r.w + 8, r.y + r.d + 8, 0),
        project(r.x + 8, r.y + r.d + 8, 0),
      ])} fill="rgba(0,0,0,0.08)" />
      {/* right face (darker) */}
      <polygon points={poly(bottomRight)} fill={isDark ? '#1c1916' : 'rgba(0,0,0,0.18)'} stroke={r.stroke} strokeWidth="1.5" style={{ transition: 'filter 0.3s' }} />
      {/* front face */}
      <polygon points={poly(bottomFront)} fill={isDark ? '#26221d' : 'rgba(0,0,0,0.12)'} stroke={r.stroke} strokeWidth="1.5" />
      {/* top */}
      <polygon points={poly(top)} fill={r.color} stroke={r.stroke} strokeWidth="2"
        style={{ filter: isHover ? `drop-shadow(0 0 24px ${P.lime})` : 'none', transition: 'filter 0.3s' }} />

      {/* label on top */}
      <g transform={`translate(${cx}, ${cy})`}>
        <text textAnchor="middle" dy="-8" fontFamily={P.mono} fontSize="10" letterSpacing="2" fill={isDark ? P.bg : P.ink} opacity="0.6">
          PLATEAU {r.num}
        </text>
        <text textAnchor="middle" dy="14" fontFamily={P.display} fontSize={r.id === 'commun' ? 18 : 26} fontWeight="700" fill={isDark ? P.bg : P.ink} letterSpacing="-1">
          {r.label}
        </text>
        <text textAnchor="middle" dy="34" fontFamily={P.mono} fontSize="11" letterSpacing="1.5" fill={isDark ? P.bg : P.ink} opacity="0.7">
          {r.area}
        </text>
      </g>
    </g>
  );
}

function Plan3D() {
  const [hovered, setHovered] = React.useState(null);
  const [sel, setSel] = React.useState('le-blanc');
  const selRoom = ROOMS.find(r => r.id === sel);

  // Sort rooms by y+x for proper iso z-order
  const sorted = [...ROOMS].sort((a, b) => (a.x + a.y) - (b.x + b.y));

  return (
    <window.PageShell active="plateaux">
      <window.Breadcrumb items={[{ label: 'Plateaux', href: 'plateaux.html' }, { label: 'Plan 3D' }]} />

      <section style={{ padding: '60px 40px 40px', maxWidth: 1400, margin: '0 auto' }}>
        <div style={{ fontFamily: P.mono, fontSize: 11, letterSpacing: '0.18em', color: P.inkSoft, marginBottom: 24, textTransform: 'uppercase' }}>¶ Plan 3D · Vue isométrique</div>
        <h1 style={{ fontFamily: P.display, fontSize: 'clamp(50px, 8vw, 130px)', fontWeight: 700, letterSpacing: '-0.035em', lineHeight: 0.92, margin: 0 }}>
          Le studio,<br /><span style={{ fontFamily: P.hand, color: P.lime, transform: 'rotate(-2deg)', display: 'inline-block' }}>vu d'en haut.</span>
        </h1>
        <p style={{ fontFamily: P.serif, fontSize: 22, lineHeight: 1.5, color: P.inkSoft, marginTop: 24, maxWidth: 720 }}>
          280 m² au total. Trois plateaux + espaces communs, tout sur le même niveau, accessible par un monte-charge.
        </p>
      </section>

      <section style={{ padding: '20px 40px 80px', maxWidth: 1400, margin: '0 auto', display: 'grid', gridTemplateColumns: 'minmax(0, 1fr) 380px', gap: 32, alignItems: 'flex-start' }}>
        <div style={{ background: P.paper, padding: 24, borderRadius: 24, border: `1px solid ${P.ink}15`, position: 'relative', overflow: 'hidden' }}>
          <svg viewBox="-40 -200 760 600" style={{ width: '100%', height: 'auto', display: 'block' }}>
            {/* Subtle grid */}
            <defs>
              <pattern id="iso-grid" width="40" height="40" patternUnits="userSpaceOnUse" patternTransform="skewX(-30)">
                <line x1="0" y1="0" x2="0" y2="40" stroke={`${P.ink}08`} strokeWidth="1" />
                <line x1="0" y1="0" x2="40" y2="0" stroke={`${P.ink}08`} strokeWidth="1" />
              </pattern>
            </defs>

            {sorted.map(r => (
              <IsoRoom key={r.id} r={r} hovered={hovered} sel={sel}
                onHover={setHovered} onLeave={() => setHovered(null)} onClick={setSel} />
            ))}

            {/* Compass */}
            <g transform="translate(-20, 380)">
              <circle r="22" fill={P.bg} stroke={P.ink} strokeWidth="1" />
              <text textAnchor="middle" dy="-8" fontFamily={P.mono} fontSize="10" fill={P.ink} fontWeight="700">N</text>
              <line x1="0" y1="-4" x2="0" y2="4" stroke={P.lime} strokeWidth="3" />
              <text textAnchor="middle" dy="20" fontFamily={P.mono} fontSize="9" fill={P.inkSoft}>NORD</text>
            </g>

            {/* Scale */}
            <g transform="translate(580, 410)">
              <line x1="0" y1="0" x2="80" y2="0" stroke={P.ink} strokeWidth="2" />
              <line x1="0" y1="-4" x2="0" y2="4" stroke={P.ink} strokeWidth="2" />
              <line x1="80" y1="-4" x2="80" y2="4" stroke={P.ink} strokeWidth="2" />
              <text x="40" y="-8" textAnchor="middle" fontFamily={P.mono} fontSize="10" fill={P.inkSoft} letterSpacing="1">5 M</text>
            </g>
          </svg>

          <div style={{ position: 'absolute', top: 24, right: 24, fontFamily: P.mono, fontSize: 10, letterSpacing: '0.16em', color: P.inkSoft, textTransform: 'uppercase' }}>
            Clique sur un plateau →
          </div>
        </div>

        {/* Side panel */}
        <aside style={{ position: 'sticky', top: 100, background: selRoom.color, color: selRoom.color === P.ink ? P.bg : P.ink, padding: 28, borderRadius: 24, border: `1.5px solid ${P.ink}` }}>
          <div style={{ fontFamily: P.mono, fontSize: 10, letterSpacing: '0.18em', opacity: 0.6, marginBottom: 8, textTransform: 'uppercase' }}>
            Plateau {selRoom.num}
          </div>
          <div style={{ fontFamily: P.display, fontSize: 36, fontWeight: 700, letterSpacing: '-0.02em', lineHeight: 1 }}>{selRoom.label}</div>
          <div style={{ fontFamily: P.serif, fontSize: 18, marginTop: 8, opacity: 0.85 }}>{selRoom.info}</div>
          <div style={{ marginTop: 20, paddingTop: 16, borderTop: `1px solid ${selRoom.color === P.ink ? `${P.bg}30` : `${P.ink}30`}` }}>
            <div style={{ display: 'flex', justifyContent: 'space-between', marginBottom: 8 }}>
              <span style={{ fontFamily: P.mono, fontSize: 10, letterSpacing: '0.16em', opacity: 0.6, textTransform: 'uppercase' }}>Surface</span>
              <span style={{ fontFamily: P.serif, fontSize: 18, fontWeight: 600 }}>{selRoom.area}</span>
            </div>
          </div>
          {selRoom.id !== 'commun' && (
            <a href={`${selRoom.id}.html`} style={{ display: 'block', marginTop: 20, padding: '14px 20px', background: selRoom.color === P.ink ? P.lime : P.ink, color: selRoom.color === P.ink ? P.ink : P.bg, borderRadius: 999, textAlign: 'center', textDecoration: 'none', fontFamily: P.sans, fontSize: 14, fontWeight: 600 }}>
              Voir le plateau →
            </a>
          )}

          <div style={{ marginTop: 24, paddingTop: 20, borderTop: `1px solid ${selRoom.color === P.ink ? `${P.bg}30` : `${P.ink}30`}` }}>
            <div style={{ fontFamily: P.mono, fontSize: 10, letterSpacing: '0.16em', opacity: 0.6, marginBottom: 12, textTransform: 'uppercase' }}>Tous les espaces</div>
            <div style={{ display: 'flex', flexDirection: 'column', gap: 6 }}>
              {ROOMS.map(r => (
                <button key={r.id} onClick={() => setSel(r.id)} style={{
                  textAlign: 'left', padding: '10px 12px',
                  background: r.id === sel ? `${P.ink}20` : 'transparent',
                  border: 'none', borderRadius: 10, cursor: 'pointer',
                  color: 'inherit', fontFamily: P.sans, fontSize: 13, fontWeight: 500,
                }}>
                  {r.num} · {r.label} <span style={{ opacity: 0.5, marginLeft: 4 }}>{r.area}</span>
                </button>
              ))}
            </div>
          </div>
        </aside>
      </section>

      <window.BigCTA eyebrow="Plus parlant en vrai" title="Viens" hand="visiter." ctaLabel="Réserver une visite" ctaHref="../index.html#reserver" ctaSecondaryLabel="Comparer →" ctaSecondaryHref="comparateur.html" />
    </window.PageShell>
  );
}

const root = ReactDOM.createRoot(document.getElementById('root'));
root.render(<Plan3D />);
</script>
</body>
</html>
