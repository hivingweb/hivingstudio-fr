<!DOCTYPE html>
<html lang="fr">
<head>
<meta charset="UTF-8" />
<meta name="viewport" content="width=device-width, initial-scale=1.0" />
<title>Comparateur des 3 plateaux food | HIVING FOOD Paris</title>
<meta name="description" content="Comparez LE BLANC, LA TABLE et LA CUISINE — surfaces, lumière, équipement, tarifs. Tableau comparatif clair pour choisir le bon plateau." />
<link rel="canonical" href="https://hivingstudio.fr/pages/comparateur.html" />

<link rel="preconnect" href="https://fonts.googleapis.com" />
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
<link href="https://fonts.googleapis.com/css2?family=Fraunces:ital,opsz,wght@0,9..144,300;0,9..144,400;0,9..144,500;0,9..144,600;0,9..144,700;1,9..144,400;1,9..144,500&family=Inter:wght@300;400;500;600;700&family=JetBrains+Mono:wght@400;500&family=Caveat:wght@400;500;600;700&family=Familjen+Grotesk:wght@400;500;600;700&family=Archivo:wght@500;600;700;800&display=swap" rel="stylesheet" />

<style>body { margin: 0; background: #fafaf5; font-family: 'Inter', sans-serif; -webkit-font-smoothing: antialiased; } *, *::before, *::after { box-sizing: border-box; }</style>

<script src="https://unpkg.com/react@18.3.1/umd/react.development.js" integrity="sha384-hD6/rw4ppMLGNu3tX5cjIb+uRZ7UkRJ6BPkLpg4hAu/6onKUg4lLsHAs9EBPT82L" crossorigin="anonymous"></script>
<script src="https://unpkg.com/react-dom@18.3.1/umd/react-dom.development.js" integrity="sha384-u6aeetuaXnQ38mYT8rp6sbXaQe3NL9t+IBXmnYxwkUI2Hw4bsp2Wvmx4yRQF1uAm" crossorigin="anonymous"></script>
<script src="https://unpkg.com/@babel/standalone@7.29.0/babel.min.js" integrity="sha384-m08KidiNqLdpJqLq95G/LEi8Qvjl/xUYll3QILypMoQ65QorJ9Lvtp2RXYGBFj1y" crossorigin="anonymous"></script>

<script type="text/babel" src="../site-i18n.jsx"></script>
<script type="text/babel" src="../site-data.jsx"></script>
<script type="text/babel" src="../site-shared.jsx"></script>
</head>
<body>
<div id="root"></div>

<script type="text/babel">
const P = window.HIVING_PALETTE;

const ROWS = [
  { l: 'Surface', k: 'surface' },
  { l: 'Hauteur sous plafond', k: 'ceiling' },
  { l: 'Lumière', k: 'light' },
  { l: 'Cyclo / décors', k: 'cyclo' },
  { l: 'Capacité', k: 'capacity' },
  { l: 'Accès', k: 'access' },
];

const RECOS = {
  'le-blanc': ['Packshot e-commerce', 'Catalogue', 'Éditorial magazine', 'Photo packaging'],
  'la-table': ['Lifestyle table dressée', 'Stop motion', 'Ambiance/scène', 'Direction artistique'],
  'la-cuisine': ['Spot TV cooking', 'Capsules YouTube', 'Film de geste', 'Chef-driven'],
};

function ComparateurPage() {
  const plateaux = window.HIVING_PLATEAUX;

  return (
    <window.PageShell active="plateaux">
      <window.Breadcrumb items={[
        { label: 'Plateaux', href: 'plateaux.html' },
        { label: 'Comparateur' },
      ]} />

      <section style={{ padding: '60px 40px 40px', maxWidth: 1400, margin: '0 auto' }}>
        <div style={{ fontFamily: P.mono, fontSize: 11, letterSpacing: '0.18em', color: P.inkSoft, marginBottom: 24, textTransform: 'uppercase' }}>
          ¶ Comparateur
        </div>
        <h1 style={{
          fontFamily: P.display, fontSize: 'clamp(50px, 8vw, 120px)',
          fontWeight: 700, letterSpacing: '-0.035em', lineHeight: 0.92, margin: 0,
        }}>
          Trouve le plateau<br />
          <span style={{ fontFamily: P.hand, color: P.lime, transform: 'rotate(-2deg)', display: 'inline-block' }}>qui va.</span>
        </h1>
        <p style={{ fontFamily: P.serif, fontSize: 22, lineHeight: 1.5, color: P.inkSoft, marginTop: 24, maxWidth: 720 }}>
          Surface, lumière, équipement, tarif — tout ce qu'il faut pour choisir.
        </p>
      </section>

      {/* Comparison table */}
      <section style={{ padding: '40px 40px 80px', maxWidth: 1400, margin: '0 auto' }}>
        <div style={{
          background: P.paper, borderRadius: 28, padding: 8,
          border: `1.5px solid ${P.ink}`, overflow: 'auto',
        }}>
          <table style={{ width: '100%', borderCollapse: 'collapse', minWidth: 720 }}>
            <thead>
              <tr>
                <th style={{ width: 200, padding: 24, textAlign: 'left' }}></th>
                {plateaux.map(p => {
                  const dark = p.color === '#0a0908';
                  return (
                    <th key={p.slug} style={{
                      padding: 24, textAlign: 'left', verticalAlign: 'top',
                      background: p.color, color: dark ? P.bg : P.ink,
                      borderRadius: 20, minWidth: 220,
                    }}>
                      <div style={{ fontFamily: P.mono, fontSize: 10, letterSpacing: '0.18em', opacity: 0.6, textTransform: 'uppercase' }}>
                        Plateau {p.num}
                      </div>
                      <div style={{ fontFamily: P.display, fontSize: 32, fontWeight: 700, letterSpacing: '-0.02em', marginTop: 6, lineHeight: 1 }}>
                        {p.name}
                      </div>
                      <div style={{ fontFamily: P.hand, fontSize: 22, fontWeight: 700, color: dark ? P.lime : P.ink, marginTop: 4, transform: 'rotate(-2deg)', display: 'inline-block' }}>
                        {p.tagline}
                      </div>
                    </th>
                  );
                })}
              </tr>
            </thead>
            <tbody>
              {ROWS.map((row, i) => (
                <tr key={row.k} style={{ borderTop: i === 0 ? 'none' : `1px solid ${P.ink}10` }}>
                  <td style={{ padding: '20px 24px', fontFamily: P.mono, fontSize: 11, letterSpacing: '0.14em', color: P.inkSoft, textTransform: 'uppercase', verticalAlign: 'top' }}>
                    {row.l}
                  </td>
                  {plateaux.map(p => (
                    <td key={p.slug} style={{ padding: '20px 24px', fontFamily: P.serif, fontSize: 18, lineHeight: 1.4, verticalAlign: 'top' }}>
                      {p[row.k]}
                    </td>
                  ))}
                </tr>
              ))}
              <tr style={{ borderTop: `1px solid ${P.ink}10` }}>
                <td style={{ padding: '20px 24px', fontFamily: P.mono, fontSize: 11, letterSpacing: '0.14em', color: P.inkSoft, textTransform: 'uppercase', verticalAlign: 'top' }}>
                  Recommandé pour
                </td>
                {plateaux.map(p => (
                  <td key={p.slug} style={{ padding: '20px 24px', verticalAlign: 'top' }}>
                    <ul style={{ margin: 0, padding: 0, listStyle: 'none', display: 'flex', flexDirection: 'column', gap: 6 }}>
                      {RECOS[p.slug].map((r, j) => (
                        <li key={j} style={{ fontFamily: P.sans, fontSize: 14, color: P.ink, display: 'flex', alignItems: 'baseline', gap: 8 }}>
                          <span style={{ color: P.lime, fontWeight: 700 }}>✓</span>{r}
                        </li>
                      ))}
                    </ul>
                  </td>
                ))}
              </tr>
              <tr style={{ borderTop: `1px solid ${P.ink}10` }}>
                <td style={{ padding: '20px 24px', fontFamily: P.mono, fontSize: 11, letterSpacing: '0.14em', color: P.inkSoft, textTransform: 'uppercase', verticalAlign: 'top' }}>
                  Tarif journée
                </td>
                {plateaux.map(p => (
                  <td key={p.slug} style={{ padding: '20px 24px', verticalAlign: 'top' }}>
                    <div style={{ fontFamily: P.display, fontSize: 32, fontWeight: 700, letterSpacing: '-0.02em', lineHeight: 1 }}>
                      {p.price.toLocaleString('fr-FR')}&nbsp;€
                    </div>
                    <div style={{ fontFamily: P.mono, fontSize: 10, letterSpacing: '0.12em', color: P.inkSoft, marginTop: 4 }}>
                      ½ jour {p.priceHalf}&nbsp;€
                    </div>
                  </td>
                ))}
              </tr>
              <tr>
                <td></td>
                {plateaux.map(p => {
                  const dark = p.color === '#0a0908';
                  return (
                    <td key={p.slug} style={{ padding: '20px 24px' }}>
                      <a href={`${p.slug}.html`} style={{
                        display: 'inline-block', padding: '12px 20px',
                        background: dark ? P.lime : P.ink,
                        color: dark ? P.ink : P.bg,
                        borderRadius: 999, textDecoration: 'none',
                        fontFamily: P.sans, fontSize: 13, fontWeight: 600,
                      }}>
                        Voir le plateau →
                      </a>
                    </td>
                  );
                })}
              </tr>
            </tbody>
          </table>
        </div>
      </section>

      <window.BigCTA
        eyebrow="Hésitation ?"
        title="On en parle"
        hand="5 min."
        ctaLabel="Devis instantané"
        ctaHref="devis.html"
        ctaSecondaryLabel="Réserver une visite"
        ctaSecondaryHref="../index.html#reserver"
      />
    </window.PageShell>
  );
}

const root = ReactDOM.createRoot(document.getElementById('root'));
root.render(<ComparateurPage />);
</script>
</body>
</html>
